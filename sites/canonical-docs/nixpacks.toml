# Pin Node + ensure Yarn 4 via corepack. Railway runs the commands in
# railway.json, but defining the env here keeps things explicit.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["corepack enable", "yarn install --immutable"]

[phases.build]
cmds = ["yarn build"]

[start]
cmd = "yarn start"

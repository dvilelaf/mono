name: npm Publish

on:
  push:
    branches: [main]
    paths: ['client/**']
  release:
    types: [published]

# Trusted publishing (OIDC): register this single workflow on npmjs for
# @jinn-network/client. npm allows one trusted publisher config per package.
permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: client

jobs:
  publish:
    name: Publish package
    if: github.event_name == 'push' || startsWith(github.event.release.tag_name, 'client-v')
    runs-on: ubuntu-latest
    # Stable publish runs the release-gate suite (jinn-mono-2cl.7): ~40-45 min for both gates
    # + ~5-7 min for build/test + buffer for npm publish. 90 min upper bound catches gate
    # hangs (e.g., Anvil port-bind failure) without cutting legitimate runs short. Canary
    # publish completes in ~5-7 min, well under the cap.
    timeout-minutes: 90
    environment: npm-publish
    env:
      JINN_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: npm install -g npm@11.5.1
      - run: corepack enable
      - run: yarn install --immutable
      # Keep the publish test environment aligned with CI. Some client unit
      # tests spawn a local Anvil fork and fail with `spawn anvil ENOENT`
      # unless Foundry is installed.
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Resolve publish metadata
        id: meta
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            PUBLISH_VERSION="${PACKAGE_VERSION}-canary.${SHORT_SHA}"
            DIST_TAG="canary"
          else
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            case "${RELEASE_TAG}" in
              client-v*)
                PUBLISH_VERSION="${RELEASE_TAG#client-v}"
                ;;
              *)
                echo "::error::Stable client releases must use tags shaped like client-vX.Y.Z"
                exit 1
                ;;
            esac

            if [ "${PUBLISH_VERSION}" != "${PACKAGE_VERSION}" ]; then
              echo "::error::Release tag version ${PUBLISH_VERSION} does not match client/package.json version ${PACKAGE_VERSION}"
              exit 1
            fi

            DIST_TAG="latest"
          fi

          echo "package_version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "publish_version=${PUBLISH_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "dist_tag=${DIST_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Patch package version for canary publish
        if: github.event_name == 'push'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.meta.outputs.publish_version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - run: yarn typecheck
      - run: yarn build
      - run: yarn test

      - name: Publish canary
        if: steps.meta.outputs.dist_tag == 'canary'
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public --tag canary

      # Heavy release gates (jinn-mono-2cl.7, per the engineering handbook §Cadence).
      # Only run for stable releases (dist_tag == 'latest'). Combined runtime ~30 min;
      # running these on every canary merge would slow the rolling channel from ~5 min
      # to ~30 min. The package's `prepublishOnly` script stays cheap (typecheck +
      # build + test); these workflow steps are the release-quality gate that must
      # pass before stable npm publish.
      - name: Release gate — operator-gate (staking + e2e on Anvil fork)
        if: steps.meta.outputs.dist_tag == 'latest'
        run: yarn release:operator-gate

      - name: Release gate — donation-consumption (cross-operator donation e2e)
        if: steps.meta.outputs.dist_tag == 'latest'
        run: yarn release:donation-consumption

      - name: Publish stable
        if: steps.meta.outputs.dist_tag == 'latest'
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public
